<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 135 1200 630" role="img" aria-labelledby="title desc"><title id="title">UtilityPot — Focused tools for everyday work. Seven tools run in your browser; three use bounded AI when you ask.</title><desc id="desc">A UtilityPot U inside the ModePot flask beside the utilitypot wordmark. Open-source utilities for data, text, diagrams and planning.</desc><rect width="1200" height="900" fill="#080C12"/><g transform="translate(78 267) scale(3)"><path d="M44 22h10v20c0 5-2.3 9.6-6.2 12.4C34.1 64.3 26 78.2 26 93c0 17 12.7 25 38 25s38-8 38-25c0-14.8-8.1-28.7-21.8-38.6C76.3 51.6 74 47 74 42V22h10" fill="none" stroke="#F28CBE" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/><path d="M47 77v14c0 18 34 18 34 0V77" fill="none" stroke="#F28CBE" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/></g><path d="M456 220V680" stroke="#30343C" stroke-width="2"/><g font-family="Manrope, Arial, sans-serif"><text x="520" y="286" fill="#66D9FF" font-size="22" font-weight="700" letter-spacing="5">MODEPOT / OPEN SOURCE</text><text x="510" y="446" fill="#F4F0E7" font-size="100" font-weight="700" letter-spacing="-5">utility<tspan fill="#F28CBE">pot</tspan></text><text x="520" y="526" fill="#C1C4CD" font-size="31">Focused browser tools for everyday work.</text><text x="520" y="572" fill="#C1C4CD" font-size="25">7 browser-local tools · 3 disclosed AI tools</text></g><path d="M520 626H1090" stroke="#F2B84B" stroke-width="4"/></svg>
